name: CI

on:
  push:
    branches:
      - main
      - ai-assistant-frontend

  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Project structure check passed"
          test -f README.md
          test -d frontend
          test -d backend
          test -d ai_assistant